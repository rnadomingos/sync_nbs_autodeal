[project]
name = "sync-nbs-autodeal"
version = "0.1.0"
description = ""
authors = [{ name = "Renan Domingos", email = "rna.domingos@hotmail.com" }]
requires-python = ">=3.12,<3.15"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "taskipy (>=1.14.1,<2.0.0)",
    "isort (>=6.0.1,<7.0.0)",
    "black (>=25.1.0,<26.0.0)",
    "pytest (>=8.4.1,<9.0.0)",
    "pytest-watcher (>=0.4.3,<0.5.0)",
    "pydantic (>=2.11.7,<3.0.0)",
    "pandera[io] (>=0.25.0,<0.26.0)",
    "sqlalchemy (>=2.0.41,<3.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "oracledb (>=3.2.0,<4.0.0)",
    "pandas (>=2.3.1,<3.0.0)",
    "psycopg2 (>=2.9.10,<3.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "apache-airflow (>=3.2.0,<4.0.0)",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.taskipy.tasks]
format = """
isort .
black .
"""
kill = "kill -9 $(lsof -t -i :8000)"
test = "pytest -v"
watch = "ptw . -v -l --force-short-summary --color=auto"
run = "python -m include.pipeline"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
package = false